version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: nikey
      POSTGRES_PASSWORD: nikey123
      POSTGRES_DB: stayaware
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://nikey:nikey123@db:5432/stayaware
      SECRET_KEY: stayaware-secret-key-2026
    depends_on:
      - db

volumes:
  postgres_data:
