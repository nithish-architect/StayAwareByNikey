{% extends "base.html" %}
{% block content %}

<div class="category-page">
    <div class="category-header">
        <span class="big-icon">{{ category.icon }}</span>
        <h2>{{ category.name }}</h2>
        <p>{{ category.description }}</p>
    </div>

    <div class="articles-list">
        {% for art in articles %}
        <a href="{{ url_for('main.article', article_id=art.id) }}" class="article-card">
            <h3>{{ art.title }}</h3>
            <div class="myth-preview">
                <span class="myth-tag">MYTH</span>
                <p>{{ art.myth[:100] }}...</p>
            </div>
        </a>
        {% else %}
        <p>No articles yet in this category.</p>
        {% endfor %}
    </div>

    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">← Back</a>
</div>

{% endblock %}
